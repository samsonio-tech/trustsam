<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0D0F" />
<title>Trust wallet — Settings</title>
<style>
  /* ==========================================================
     1. DESIGN TOKENS  (identical to index.html / buy.html)
     ========================================================== */
  :root {
    --bg:        #0B0D0F;
    --card:      #14171A;
    --pill:      #1E242B;
    --hairline:  rgba(255,255,255,.07);

    --text:      #FFFFFF;
    --text-2:    #E9EBEF;
    --dim:       #8A96A0;

    --blue:      #3861FB;
    --blue-2:    #2F66F6;
    --green:     #16C784;
    --red:       #F6465D;
    --orange:    #F7931A;
    --track:     #3A424A;

    --r-card:    16px;
    --r-sm:      8px;
    --r-pill:    999px;

    --gutter:    16px;
    --tabbar-h:  62px;
    --font: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont,
            "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ==========================================================
     2. RESET
     ========================================================== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: #050608;
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    justify-content: center;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  svg { display: block; }

  /* ==========================================================
     3. APP SHELL
     ========================================================== */
  .app {
    width: 100%;
    max-width: 430px;
    min-height: 100dvh;
    background: var(--bg);
    padding:
      calc(8px + env(safe-area-inset-top))
      var(--gutter)
      calc(var(--tabbar-h) + 34px + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 10px; height: 48px; }

  .topbar__back {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: var(--r-pill);
    display: grid; place-items: center; color: var(--text-2);
    transition: background-color .15s ease;
  }
  .topbar__back:hover { background: var(--card); }

  .topbar__title {
    flex: 1 1 auto; min-width: 0; margin: 0; text-align: center;
    font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
  }
  .topbar__spacer { flex: 0 0 auto; width: 38px; height: 38px; }

  /* ---------- Settings list ---------- */
  .settings-list { margin-top: 12px; display: grid; gap: 8px; }
  .set-item {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 16px 14px; background: var(--card); border-radius: var(--r-card);
    text-align: left; transition: background-color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .set-item:hover { background: #181C20; }
  .set-item:active { background: var(--pill); }
  .set-item__icon {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px;
    background: var(--pill); display: grid; place-items: center; color: var(--text-2);
  }
  .set-item__body { flex: 1 1 auto; min-width: 0; }
  .set-item__title { display: block; font-size: 15px; font-weight: 600; color: var(--text); }
  .set-item__desc { display: block; margin-top: 3px; font-size: 12.5px; line-height: 1.4; color: var(--dim); }
  .set-item__chev { flex: 0 0 auto; color: var(--dim); }

  /* ---------- Toast (same as index.html / buy.html) ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(6px); z-index: 80; max-width: min(90vw, 380px);
    padding: 10px 16px; background: #252C34; color: var(--text-2); font-size: 13.5px;
    border-radius: var(--r-pill); border: 1px solid var(--hairline);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  }
  .toast.is-show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Bottom tab bar (same as index.html / buy.html) ---------- */
  .tabbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 30;
    width: 100%; max-width: 430px; display: grid; grid-template-columns: repeat(4, 1fr);
    background: rgba(11,13,15,.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-top: 1px solid var(--hairline); padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 2px;
    color: var(--dim); font-size: 10.5px; font-weight: 600; letter-spacing: .01em;
    border-radius: var(--r-sm); -webkit-tap-highlight-color: transparent;
  }
  .tab:hover { color: var(--text-2); }
  .tab.is-active { color: var(--blue); }
  .tab:active svg { transform: scale(.92); }

  /* ==========================================================
     4. RESPONSIVE
     ========================================================== */
  @media (max-width: 359px) {
    .set-item { padding: 14px 12px; gap: 11px; }
    .set-item__desc { font-size: 12px; }
  }
  @media (max-width: 400px) {
    :root { --gutter: 14px; }
  }
  @media (min-width: 520px) {
    body { padding: 28px 0 110px; }
    .app { min-height: auto; border-radius: 28px; border: 1px solid rgba(255,255,255,.06); box-shadow: 0 30px 70px rgba(0,0,0,.6); padding: 20px 22px 32px; }
    .tabbar { bottom: 14px; width: min(100%, 430px); border: 1px solid var(--hairline); border-radius: var(--r-pill); padding: 8px 10px; box-shadow: 0 18px 40px rgba(0,0,0,.55); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<body>
<div class="app">

  <!-- ============ TOP BAR ============ -->

    <!-- Backup and sync -->

<!-- ============ TOAST ============ -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  /* ---------- Toast ---------- */
  const toast = document.getElementById("toast");
  let toastTimer = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("is-show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("is-show"), 2200);
  }

  /* ---------- Settings rows ---------- */
  document.querySelectorAll(".set-item").forEach((btn) => {
    btn.addEventListener("click", () => {
      showToast(btn.dataset.section + " \u2014 opening soon");
    });
  });
})();
</script>
</body>
